<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Benar Salah AI</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        display: ['"Fredoka One"', 'cursive'],
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans text-slate-800 antialiased bg-slate-900 w-screen h-screen overflow-hidden flex select-none">

    <!-- Screen Game -->
    <div class="relative w-full h-full flex bg-black">
        
        <!-- Video Kamera -->
        <video id="webcam" class="absolute inset-0 w-full h-full object-cover transform -scale-x-100" autoplay muted playsinline></video>
        
        <!-- Overlay Petunjuk Kiri-Kanan -->
        <div class="absolute left-0 top-0 w-1/2 h-full bg-red-500/20 border-r-2 border-white/20 flex items-center justify-center pointer-events-none">
            <span class="text-white/60 font-display text-4xl md:text-6xl tracking-widest">👈 SALAH</span>
        </div>
        <div class="absolute right-0 top-0 w-1/2 h-full bg-green-500/20 flex items-center justify-center pointer-events-none">
            <span class="text-white/60 font-display text-4xl md:text-6xl tracking-widest">BENAR 👉</span>
        </div>

        <!-- Header Atas: Skor, Soal & Waktu -->
        <div class="absolute top-0 left-0 w-full p-6 flex justify-between items-start z-30 pointer-events-none">
            <div class="bg-slate-800/90 backdrop-blur-md text-white px-6 py-3 rounded-2xl shadow-xl flex flex-col items-center border border-slate-700">
                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Skor</span>
                <span class="text-3xl font-display text-emerald-400" id="score">0</span>
            </div>

            <div class="bg-slate-800/95 backdrop-blur-md px-8 py-5 rounded-3xl shadow-2xl border border-slate-700 max-w-2xl mx-auto flex-grow text-center mx-4">
                <h2 class="text-emerald-400 font-bold text-sm tracking-widest uppercase mb-1" id="q-num">Memuat Soal...</h2>
                <p class="text-2xl md:text-3xl font-bold text-white leading-snug" id="q-text">Mengecek koneksi ke Spreadsheet...</p>
            </div>

            <div class="bg-slate-800/90 backdrop-blur-md text-white px-6 py-3 rounded-2xl shadow-xl flex flex-col items-center border border-slate-700">
                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Waktu</span>
                <span class="text-3xl font-display text-amber-400" id="timer">15</span>
            </div>
        </div>

        <!-- Status AI/Kamera Overlay -->
        <div id="status-box" class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur-md px-6 py-2.5 rounded-full border border-slate-700 text-xs font-bold text-white z-30 flex items-center gap-2 shadow-2xl">
            <span id="status-dot" class="w-3 h-3 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="status-text">Menyiapkan Kamera & AI...</span>
        </div>
    </div>

    <script>
        // TEMPELKAN URL WEB APP GOOGLE APPS SCRIPT KAMU DI DALAM TANDA KUTIP SINI:
        const API_URL = "https://script.google.com/macros/s/AKfycbzCnDwFsd4prRSr4eVDKmOJmAWhLgI3WzuTJo9ez-X2f76MeUd3E0CSKi1xHT2fBtcIxQ/exec";

        let quizData = [];
        let currentIdx = 0;
        let score = 0;
        let timer = 15;
        let timerInterval;
        let isAnswering = false;

        const video = document.getElementById('webcam');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');

        async function init() {
            try {
                // 1. Ambil data soal
                statusText.innerText = 'Mengambil soal dari Spreadsheet...';
                const response = await fetch(API_URL);
                quizData = await response.json();

                if (!quizData || quizData.length === 0) {
                    throw new Error("Data soal di Spreadsheet kosong!");
                }

                // 2. Akses Kamera
                statusText.innerText = 'Meminta izin kamera...';
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;

                // 3. Muat Model AI
                statusText.innerText = 'Memuat Model Deteksi Wajah...';
                await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/');

                statusDot.className = 'w-3 h-3 rounded-full bg-emerald-500 animate-pulse';
                statusText.innerText = 'Kamera & AI Aktif!';

                startQuiz();
                startDetection();
            } catch (err) {
                statusDot.className = 'w-3 h-3 rounded-full bg-rose-500';
                statusText.innerText = 'Error: ' + err.message;
                alert('Gagal: ' + err.message);
            }
        }

        function startQuiz() {
            if (currentIdx >= quizData.length) {
                document.getElementById('q-num').innerText = "PERMAINAN SELESAI 🎉";
                document.getElementById('q-text').innerText = `Skor Akhir Anda: ${score}`;
                confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
                return;
            }

            isAnswering = false;
            const q = quizData[currentIdx];
            document.getElementById('q-num').innerText = `Pertanyaan ${currentIdx + 1} dari ${quizData.length}`;
            document.getElementById('q-text').innerText = q.pertanyaan;
            
            timer = q.timer || 15;
            document.getElementById('timer').innerText = timer;

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timer--;
                document.getElementById('timer').innerText = timer;
                if (timer <= 0) {
                    clearInterval(timerInterval);
                    nextQuestion();
                }
            }, 1000);
        }

        async function startDetection() {
            setInterval(async () => {
                if (isAnswering || video.paused || video.ended) return;

                const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions());
                if (detections.length > 0) {
                    const face = detections[0].box;
                    const faceCenterX = face.x + (face.width / 2);
                    const videoWidth = video.videoWidth || 640;

                    // Mengengkolkan kepala/badan ke kiri atau kanan (Mirror View)
                    if (faceCenterX < videoWidth * 0.4) {
                        processAnswer('SALAH');
                    } else if (faceCenterX > videoWidth * 0.6) {
                        processAnswer('BENAR');
                    }
                }
            }, 200);
        }

        function processAnswer(userAnswer) {
            isAnswering = true;
            clearInterval(timerInterval);

            const correctAnswer = quizData[currentIdx].jawaban;
            const isCorrect = (userAnswer === correctAnswer);

            if (isCorrect) {
                score += 10;
                document.getElementById('score').innerText = score;
                confetti({ particleCount: 60, spread: 60, origin: { y: 0.7 } });
            }

            statusText.innerText = isCorrect ? `✅ Jawaban Kamu Benar (${userAnswer})!` : `❌ Jawaban Kamu Salah!`;

            setTimeout(() => {
                statusText.innerText = 'Kamera & AI Aktif!';
                nextQuestion();
            }, 1500);
        }

        function nextQuestion() {
            currentIdx++;
            startQuiz();
        }

        window.onload = init;
    </script>
</body>
</html>
